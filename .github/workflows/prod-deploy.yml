name: Headless Production Database Deployment

on:
  repository_dispatch:
    types: [ jira-cab-approved ]

jobs:
  deploy-production:
    name: Headless Flyway Migration
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Flyway Migration against Supabase
        id: flyway_run
        env:
          FLYWAY_URL: ${{ secrets.PROD_DB_JDBC_URL }}
          FLYWAY_USER: ${{ secrets.PROD_DB_USER }}
          FLYWAY_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          echo "Starting Flyway migration..."
          
          # Run flyway info and migrate, capturing output to a log file so we can read the exact error if it fails
          set +e
          docker run --rm \
            -v "${{ github.workspace }}/sql:/flyway/sql" \
            -e FLYWAY_URL="$FLYWAY_URL" \
            -e FLYWAY_USER="$FLYWAY_USER" \
            -e FLYWAY_PASSWORD="$FLYWAY_PASSWORD" \
            -e FLYWAY_LOCATIONS="filesystem:/flyway/sql" \
            -e FLYWAY_CONNECT_RETRIES=5 \
            flyway/flyway:latest \
            migrate > flyway_output.log 2>&1
          
          EXIT_CODE=$?
          echo "=== FLYWAY LOG OUTPUT ==="
          cat flyway_output.log
          echo "========================="

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Flyway failed with exit code $EXIT_CODE"
            # Extract first 500 chars of error to post to Jira
            ERROR_SNIPPET=$(tail -n 20 flyway_output.log | tr '\n' ' ' | sed 's/"/\\"/g' | cut -c 1-300)
            echo "ERROR_SNIPPET=$ERROR_SNIPPET" >> $GITHUB_ENV
            exit $EXIT_CODE
          fi

      - name: Post Success Comment and Transition Ticket to Implemented
        if: success()
        run: |
          ISSUE_KEY="${{ github.event.client_payload.issue_key }}"
          JIRA_BASE=$(echo "${{ secrets.JIRA_URL }}" | sed 's:/*$::')
          if [[ ! "$JIRA_BASE" =~ ^https?:// ]]; then
            JIRA_BASE="https://$JIRA_BASE"
          fi

          if [ -n "$ISSUE_KEY" ] && [ -n "${{ secrets.JIRA_API_TOKEN }}" ]; then
            echo "Posting success comment to $ISSUE_KEY..."
            curl -f -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST "$JIRA_BASE/rest/api/3/issue/${ISSUE_KEY}/comment" \
              -u "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{
                "body": {
                  "type": "doc",
                  "version": 1,
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Automated Production Database Deployment SUCCEEDED.\n• Executed headless via GitHub Actions.\n• Commit: '"${{ github.sha }}"'\n• Approved by: '"${{ github.event.client_payload.approver }}"'"
                        }
                      ]
                    }
                  ]
                }
              }' || echo "Failed to post comment to Jira."

            echo "Transitioning $ISSUE_KEY to Implemented (Transition ID: 51)..."
            curl -f -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST "$JIRA_BASE/rest/api/3/issue/${ISSUE_KEY}/transitions" \
              -u "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"transition": {"id": "51"}}' || echo "Failed to transition issue in Jira."
          fi

      - name: Post Failure Alert to Jira Issue
        if: failure()
        run: |
          ISSUE_KEY="${{ github.event.client_payload.issue_key }}"
          JIRA_BASE=$(echo "${{ secrets.JIRA_URL }}" | sed 's:/*$::')
          if [[ ! "$JIRA_BASE" =~ ^https?:// ]]; then
            JIRA_BASE="https://$JIRA_BASE"
          fi

          if [ -n "$ISSUE_KEY" ] && [ -n "${{ secrets.JIRA_API_TOKEN }}" ]; then
            echo "Posting failure alert to $ISSUE_KEY with error snippet..."
            curl -s -X POST "$JIRA_BASE/rest/api/3/issue/${ISSUE_KEY}/comment" \
              -u "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{
                "body": {
                  "type": "doc",
                  "version": 1,
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "CRITICAL: Database Deployment FAILED in GitHub Actions.\nError:\n'"${ERROR_SNIPPET}"'"
                        }
                      ]
                    }
                  ]
                }
              }' || true
          fi
