name: Headless Production Database Deployment

on:
  repository_dispatch:
    types: [ jira-cab-approved ]

jobs:
  deploy-production:
    name: Headless Flyway Migration
    runs-on: ubuntu-latest
    environment: jira-demo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Flyway Migration against Supabase
        id: flyway_run
        env:
          FLYWAY_URL: ${{ secrets.PROD_DB_JDBC_URL }}
          FLYWAY_USER: ${{ secrets.PROD_DB_USER }}
          FLYWAY_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          echo "Starting Flyway migration..."
          
          set +e
          docker run --rm \
            -v "${{ github.workspace }}/sql:/flyway/sql" \
            -e FLYWAY_URL="$FLYWAY_URL" \
            -e FLYWAY_USER="$FLYWAY_USER" \
            -e FLYWAY_PASSWORD="$FLYWAY_PASSWORD" \
            -e FLYWAY_LOCATIONS="filesystem:/flyway/sql" \
            -e FLYWAY_CONNECT_RETRIES=5 \
            flyway/flyway:latest \
            migrate > flyway_output.log 2>&1
          
          EXIT_CODE=$?
          echo "=== FLYWAY LOG OUTPUT ==="
          cat flyway_output.log
          echo "========================="

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Flyway failed with exit code $EXIT_CODE"
            tail -n 25 flyway_output.log > "${{ github.workspace }}/flyway_error.txt"
            exit $EXIT_CODE
          fi

      - name: Post Success Comment and Transition Ticket to Implemented
        if: success()
        run: |
          ISSUE_KEY="${{ github.event.client_payload.issue_key }}"
          JIRA_BASE="${{ secrets.JIRA_URL }}"
          if [ -z "$JIRA_BASE" ]; then
            JIRA_BASE="https://centroid-demo.atlassian.net"
          fi
          JIRA_BASE=$(echo "$JIRA_BASE" | sed 's:/*$::')
          if [[ ! "$JIRA_BASE" =~ ^https?:// ]]; then
            JIRA_BASE="https://$JIRA_BASE"
          fi

          JIRA_USER="${{ secrets.JIRA_USER_EMAIL }}"
          if [ -z "$JIRA_USER" ]; then
            JIRA_USER="jeremy.darling@centroid.com"
          fi

          echo "Target Jira: $JIRA_BASE (User: $JIRA_USER, Issue: $ISSUE_KEY)"

          if [ -n "$ISSUE_KEY" ] && [ -n "${{ secrets.JIRA_API_TOKEN }}" ]; then
            echo "Posting success comment..."
            curl -i -X POST "$JIRA_BASE/rest/api/3/issue/${ISSUE_KEY}/comment" \
              -u "$JIRA_USER:${{ secrets.JIRA_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{
                "body": {
                  "type": "doc",
                  "version": 1,
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Automated Production Database Deployment SUCCEEDED.\n• Executed headless via GitHub Actions.\n• Commit: '"${{ github.sha }}"'\n• Approved by: '"${{ github.event.client_payload.approver }}"'"
                        }
                      ]
                    }
                  ]
                }
              }'

            echo "Transitioning $ISSUE_KEY to Implemented / Completed..."
            # Try Transition ID 51 (KAN board "Implemented") or ID 9322 / 9212 (DCM JSM "Completed / Implementing")
            curl -i -X POST "$JIRA_BASE/rest/api/3/issue/${ISSUE_KEY}/transitions" \
              -u "$JIRA_USER:${{ secrets.JIRA_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"transition": {"id": "51"}}' || true

            curl -i -X POST "$JIRA_BASE/rest/api/3/issue/${ISSUE_KEY}/transitions" \
              -u "$JIRA_USER:${{ secrets.JIRA_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"transition": {"id": "9322"}}' || true

            curl -i -X POST "$JIRA_BASE/rest/api/3/issue/${ISSUE_KEY}/transitions" \
              -u "$JIRA_USER:${{ secrets.JIRA_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"transition": {"id": "9212"}}' || true
          fi

      - name: Post Failure Alert to Jira Issue
        if: failure()
        run: |
          ISSUE_KEY="${{ github.event.client_payload.issue_key }}"
          JIRA_BASE="${{ secrets.JIRA_URL }}"
          if [ -z "$JIRA_BASE" ]; then
            JIRA_BASE="https://centroid-demo.atlassian.net"
          fi
          JIRA_BASE=$(echo "$JIRA_BASE" | sed 's:/*$::')
          if [[ ! "$JIRA_BASE" =~ ^https?:// ]]; then
            JIRA_BASE="https://$JIRA_BASE"
          fi

          JIRA_USER="${{ secrets.JIRA_USER_EMAIL }}"
          if [ -z "$JIRA_USER" ]; then
            JIRA_USER="jeremy.darling@centroid.com"
          fi

          ERR_MSG="Flyway execution failed. Check GitHub Actions logs."
          if [ -f "${{ github.workspace }}/flyway_error.txt" ]; then
            ERR_MSG=$(cat "${{ github.workspace }}/flyway_error.txt" | tr '\n' ' ' | sed 's/\\/\\\\/g; s/"/\\"/g' | cut -c 1-250)
          fi

          echo "Posting failure alert to $ISSUE_KEY at $JIRA_BASE (User: $JIRA_USER)..."
          curl -i -X POST "$JIRA_BASE/rest/api/3/issue/${ISSUE_KEY}/comment" \
            -u "$JIRA_USER:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "body": {
                "type": "doc",
                "version": 1,
                "content": [
                  {
                    "type": "paragraph",
                    "content": [
                      {
                        "type": "text",
                        "text": "CRITICAL: Database Deployment FAILED in GitHub Actions.\nError:\n'"${ERR_MSG}"'"
                      }
                    ]
                  }
                ]
              }
            }' || true
